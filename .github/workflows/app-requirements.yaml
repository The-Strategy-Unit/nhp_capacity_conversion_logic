name: Application requirements

on: pull_request

jobs:
  requirements-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"

      - name: Check lockfile
        run: uv lock --check

      - name: Regenerate application requirements
        run: >
          uv export
          --no-default-groups
          --group app
          --no-hashes
          --output-file requirements.txt

      - name: Verify Connect dependency resolution
        run: >
          uv pip compile requirements.txt
          --output-file /tmp/nhp-capacity-connect-requirements.txt

      - name: Check application requirements are current
        run: git diff --exit-code -- requirements.txt
